<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Queue Operations</title>
<style>
:root{
  --bg1:#eef2ff;--bg2:#fdf2f8;--bg3:#ecfeff;
  --card:#ffffff;--text:#1d1d2b;--muted:#6b6b80;--line:#dcdcf0;
  --blue:#3b82f6;--purple:#8b5cf6;--pink:#ec4899;--green:#10b981;--orange:#f97316;--red:#ef4444;
  --ok-bg:#d1fae5;--ok-tx:#065f46;--err-bg:#fee2e2;--err-tx:#991b1b;--info-bg:#e0e7ff;--info-tx:#3730a3;
  --shadow:0 6px 18px rgba(99,102,241,.15);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg1:#0f1226;--bg2:#1a1030;--bg3:#0b1a26;
    --card:#1a1d36;--text:#f1f1ff;--muted:#a3a3c2;--line:#33375e;
    --ok-bg:#064e3b;--ok-tx:#a7f3d0;--err-bg:#7f1d1d;--err-tx:#fecaca;--info-bg:#312e81;--info-tx:#c7d2fe;
    --shadow:0 6px 18px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;padding:16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  color:var(--text);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3)) fixed;
}
.wrap{max-width:480px;margin:0 auto}
h1{font-size:26px;margin:0 0 4px;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{color:var(--muted);font-size:14px;margin:0 0 16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.top{border-top:4px solid var(--purple)}
.card.ctrl{border-top:4px solid var(--green)}

/* stat chips */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px}
.chip b{font-weight:800}
.chip.f{background:#d1fae5;color:#065f46}
.chip.r{background:#ffedd5;color:#9a3412}
.chip.s{background:#dbeafe;color:#1e40af}
@media (prefers-color-scheme:dark){
  .chip.f{background:#064e3b;color:#a7f3d0}
  .chip.r{background:#7c2d12;color:#fed7aa}
  .chip.s{background:#1e3a8a;color:#bfdbfe}
}

/* cells */
.cells{display:flex;gap:6px;margin-top:6px}
.cell{flex:1;text-align:center}
.tag{height:18px;margin-bottom:4px;display:flex;justify-content:center;align-items:center}
.pill{font-size:10px;font-weight:800;color:#fff;padding:2px 6px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.pill.f{background:var(--green)}
.pill.r{background:var(--orange)}
.pill.fr{background:linear-gradient(90deg,var(--green),var(--orange))}
.box{
  height:54px;border:2px dashed var(--line);border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:700;color:var(--text);
  transition:background .2s,border-color .2s;
}
.box.on{border:2px solid transparent;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 4px 10px rgba(139,92,246,.35)}
.box.on.isf{background:linear-gradient(135deg,#10b981,#3b82f6)}
.box.on.isr{background:linear-gradient(135deg,#8b5cf6,#f97316)}
.box.on.isf.isr{background:linear-gradient(135deg,#10b981,#f97316)}
.box.pop{animation:pop .3s ease}
.box.leave{animation:leave .25s ease forwards}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes leave{to{transform:translateX(-18px);opacity:0}}
.idx{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}

/* message */
.msg{min-height:40px;font-size:15px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--info-bg);color:var(--info-tx);font-weight:600}
.msg.ok{background:var(--ok-bg);color:var(--ok-tx)}
.msg.err{background:var(--err-bg);color:var(--err-tx)}

/* controls */
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font-size:16px;padding:11px;border:2px solid var(--line);border-radius:12px;background:var(--bg1);color:var(--text);outline:none}
input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}

button{
  font-family:inherit;font-size:15px;font-weight:700;color:#fff;
  padding:12px;border:0;border-radius:12px;cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
  transition:transform .1s,filter .15s;-webkit-tap-highlight-color:transparent;
}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.96)}
.b-add{background:linear-gradient(135deg,#10b981,#059669)}
.b-del{background:linear-gradient(135deg,#fb923c,#ea580c)}
.b-peek{background:linear-gradient(135deg,#60a5fa,#2563eb)}
.b-disp{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.b-clear{background:linear-gradient(135deg,#f87171,#dc2626)}
.grid .b-clear{grid-column:1 / -1}
</style>
</head>
<body>
<div class="wrap">
  <h1>Queue (FIFO)</h1>
  <p class="sub">Array-based queue, size 5. Same logic as your C code.</p>

  <div class="card top">
    <div class="stats">
      <span class="chip f">front: <b id="f">-1</b></span>
      <span class="chip r">rear: <b id="r">-1</b></span>
      <span class="chip s">size: <b>5</b></span>
    </div>
    <div class="cells" id="cells"></div>
    <div class="msg" id="msg">Ready. Add your first value.</div>
  </div>

  <div class="card ctrl">
    <div class="row">
      <input id="val" type="number" inputmode="numeric" placeholder="Enter a value">
      <button class="b-add" onclick="enqueue()">Enqueue</button>
    </div>
    <div class="grid">
      <button class="b-del" onclick="dequeue()">Dequeue</button>
      <button class="b-peek" onclick="peek()">Peek</button>
      <button class="b-disp" onclick="display()">Display</button>
      <button class="b-clear" onclick="resetQ()">Clear</button>
    </div>
  </div>
</div>

<script>
const SIZE = 5;
let queue = new Array(SIZE).fill(null);
let front = -1, rear = -1, busy = false;
const $ = id => document.getElementById(id);

function say(t, cls){ const m=$('msg'); m.textContent=t; m.className='msg '+(cls||''); }
function isEmpty(){ return front === rear; }

function render(popIndex = -1){
  $('f').textContent = front; $('r').textContent = rear;
  let h = '';
  for(let i=0;i<SIZE;i++){
    const on = i>front && i<=rear;
    const isF = on && i===front+1, isR = on && i===rear;
    let tag = '';
    if(isF && isR) tag = '<span class="pill fr">FRONT / REAR</span>';
    else if(isF) tag = '<span class="pill f">FRONT</span>';
    else if(isR) tag = '<span class="pill r">REAR</span>';
    let cls = 'box';
    if(on) cls += ' on';
    if(isF) cls += ' isf';
    if(isR) cls += ' isr';
    if(i===popIndex) cls += ' pop';
    h += `<div class="cell"><div class="tag">${tag}</div><div class="${cls}" data-i="${i}">${on?queue[i]:''}</div><div class="idx">${i}</div></div>`;
  }
  $('cells').innerHTML = h;
}

function enqueue(){
  if(busy) return;
  if(rear === SIZE-1){ say('Queue Overflow!', 'err'); return; }
  const v = $('val').value;
  if(v === ''){ say('Enter a value first.', 'err'); return; }
  queue[++rear] = parseInt(v, 10);
  $('val').value = '';
  say('Inserted ' + queue[rear], 'ok');
  render(rear);
}

function dequeue(){
  if(busy) return;
  if(isEmpty()){ say('Queue Underflow!', 'err'); return; }
  busy = true;
  const box = document.querySelector('.box[data-i="'+(front+1)+'"]');
  if(box) box.classList.add('leave');
  setTimeout(() => {
    const el = queue[++front];
    if(front === rear){ front = -1; rear = -1; }
    say('Removed ' + el, 'ok');
    render();
    busy = false;
  }, 250);
}

function peek(){
  if(isEmpty()){ say('Queue is empty!', 'err'); return; }
  say('Front element: ' + queue[front+1]);
}

function display(){
  if(isEmpty()){ say('Queue is empty', 'err'); return; }
  say('Queue elements: ' + queue.slice(front+1, rear+1).join(' '));
}

function resetQ(){ if(busy) return; queue.fill(null); front = rear = -1; say('Queue cleared.'); render(); }

$('val').addEventListener('keydown', e => { if(e.key==='Enter') enqueue(); });
render();
</script>
</body>
</html>
